<!doctype html>
<html lang="en">
<head>

  <!-- Standard metadata -->
  <meta charset="utf-8" />
  <title>NESCAC Parser Pipeline Demo</title>

  <!-- Ensures proper scaling on mobile devices -->
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <style>

    /* ------------------------------------------------------------
       Page layout styling
       ------------------------------------------------------------ */

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      max-width: 1400px;
      margin: 32px auto;
      padding: 0 20px;
      background: #f7f7f7;
      color: #111;
    }

    h1 {
      font-size: 2.5rem;
      margin-bottom: 24px;
    }

    /* ------------------------------------------------------------
       Card container styling
       ------------------------------------------------------------ */

    .card {
      background: white;
      border: 1px solid #ddd;
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 24px;
      box-shadow: 0 1px 2px rgba(0,0,0,0.04);
    }

    .row {
      display: flex;
      gap: 20px;
      align-items: center;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }

    .schools-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 10px;
      margin-top: 12px;
      margin-bottom: 20px;
    }

    label.checkbox {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #fafafa;
      border: 1px solid #e3e3e3;
      border-radius: 10px;
      padding: 10px 12px;
    }

    button {
      background: #222;
      color: white;
      border: none;
      border-radius: 12px;
      padding: 12px 20px;
      font-size: 1rem;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .muted {
      color: #555;
    }

    .result-list {
      display: grid;
      gap: 12px;
      margin-top: 16px;
    }

    .result-item {
      border: 1px solid #ddd;
      border-radius: 12px;
      padding: 16px;
      background: #fcfcfc;
    }

    .result-item h4 {
      margin: 0 0 8px 0;
    }

    .small {
      font-size: 0.95rem;
      color: #555;
      word-break: break-word;
    }

    .status {
      white-space: pre-wrap;
    }

    .action-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 12px;
      align-items: center;
    }

    .link-button,
    .download-link {
      display: inline-block;
      text-decoration: none;
      background: #efefef;
      color: #111;
      border: 1px solid #d4d4d4;
      border-radius: 10px;
      padding: 10px 14px;
      font-weight: 600;
    }

    .link-button[aria-disabled="true"],
    .download-link[aria-disabled="true"] {
      opacity: 0.5;
      pointer-events: none;
    }

    .output {
      margin-top: 10px;
    }

    .error-text {
      color: #9f1d1d;
      font-weight: 600;
    }

    .success-text {
      color: #166534;
      font-weight: 600;
    }

    .review-wrap {
      margin-top: 14px;
      display: none;
    }

    .review-wrap.open {
      display: block;
    }

    .review-grid {
      display: grid;
      grid-template-columns: 1.1fr 1fr;
      gap: 16px;
      align-items: start;
    }

    .review-panel {
      background: white;
      border: 1px solid #ddd;
      border-radius: 12px;
      padding: 12px;
    }

    .review-panel h5 {
      margin: 0 0 10px 0;
      font-size: 1rem;
    }

    .review-frame {
      width: 100%;
      height: 700px;
      border: 1px solid #ddd;
      border-radius: 12px;
      background: white;
    }

    .table-wrap {
      max-height: 700px;
      overflow: auto;
      border: 1px solid #ddd;
      border-radius: 12px;
      background: white;
    }

    .review-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.9rem;
    }

    .review-table th,
    .review-table td {
      border-bottom: 1px solid #e5e5e5;
      padding: 8px 10px;
      text-align: left;
      vertical-align: top;
    }

    .review-table th {
      position: sticky;
      top: 0;
      background: #f7f7f7;
      z-index: 1;
    }

    .review-empty {
      padding: 12px;
      color: #555;
    }

  </style>
</head>

<body>

  <h1>NESCAC Parser Pipeline Demo</h1>

  <div class="card">

    <div class="row">

      <!-- NEW: start year replaces single year input -->
      <label>
        Start Year:
        <input id="start-year" type="number" value="2021" />
      </label>

      <!-- NEW: end year replaces single year input -->
      <label>
        End Year:
        <input id="end-year" type="number" value="2025" />
      </label>

      <label>
        Limit links (demo safety):
        <input id="limit-links" type="number" value="0" min="0" />
      </label>

    </div>

    <p class="muted">
      Choose a year range to scrape multiple seasons at once.
    </p>

    <h2>Schools</h2>
    <p class="muted">If none selected, runs all schools.</p>

    <div id="schools-container" class="schools-grid">
      <div class="muted">Loading schools...</div>
    </div>

    <button id="run-btn">Find Games</button>

  </div>

  <div class="card">
    <h2>Status</h2>
    <div id="status" class="status">Idle.</div>
  </div>

  <div class="card">
    <h2>Discovered Games</h2>
    <div id="results" class="result-list">
      <div class="muted">No results yet.</div>
    </div>
  </div>

  <script>

    const schoolsContainer = document.getElementById("schools-container");
    const runBtn = document.getElementById("run-btn");
    const statusEl = document.getElementById("status");
    const resultsEl = document.getElementById("results");

    /* NEW: start/end year inputs */
    const startYearInput = document.getElementById("start-year");
    const endYearInput = document.getElementById("end-year");

    const limitLinksInput = document.getElementById("limit-links");


    function setStatus(message) {
      statusEl.textContent = message;
    }


    function getSelectedSchools() {
      const checked = document.querySelectorAll('input[name="schools"]:checked');
      return Array.from(checked).map((el) => el.value);
    }


    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#39;");
    }


    function renderSchools(schools) {
      schoolsContainer.innerHTML = "";

      if (!schools || schools.length === 0) {
        schoolsContainer.innerHTML = '<div class="muted">No schools returned by API.</div>';
        return;
      }

      for (const school of schools) {
        const label = document.createElement("label");
        label.className = "checkbox";

        const input = document.createElement("input");
        input.type = "checkbox";
        input.name = "schools";
        input.value = school;

        const span = document.createElement("span");
        span.textContent = school;

        label.appendChild(input);
        label.appendChild(span);

        schoolsContainer.appendChild(label);
      }
    }


    async function loadSchools() {
      try {
        setStatus("Loading schools...");

        const resp = await fetch("/api/schools");
        const data = await resp.json();

        if (!resp.ok || !data.ok) {
          throw new Error(data.error || "Failed to load schools");
        }

        renderSchools(data.schools);

        /* NEW:
           use backend-provided defaults for multi-year mode */
        if (data.suggested_start_year) {
          startYearInput.value = data.suggested_start_year;
        }

        if (data.suggested_end_year) {
          endYearInput.value = data.suggested_end_year;
        }

        setStatus("Schools loaded.");

      } catch (err) {
        schoolsContainer.innerHTML =
          `<div class="muted">Failed to load schools: ${escapeHtml(err.message)}</div>`;

        setStatus(`Error loading schools: ${err.message}`);
      }
    }


    function buildDetailLine(label, value) {
      const div = document.createElement("div");
      div.className = "small";
      div.textContent = `${label}: ${value ?? ""}`;
      return div;
    }


    function normalizeRows(data) {
      return data.rows || data.table_rows || data.preview_rows || [];
    }


    function normalizeColumns(data, rows) {
      if (Array.isArray(data.columns) && data.columns.length > 0) {
        return data.columns;
      }
      if (rows.length > 0 && typeof rows[0] === "object" && rows[0] !== null) {
        return Object.keys(rows[0]);
      }
      return [];
    }


    function buildReviewTable(columns, rows) {
      const tableWrap = document.createElement("div");
      tableWrap.className = "table-wrap";

      if (!rows || rows.length === 0) {
        const empty = document.createElement("div");
        empty.className = "review-empty";
        empty.textContent = "No parsed rows were returned by the parser.";
        tableWrap.appendChild(empty);
        return tableWrap;
      }

      const table = document.createElement("table");
      table.className = "review-table";

      const thead = document.createElement("thead");
      const headRow = document.createElement("tr");

      for (const column of columns) {
        const th = document.createElement("th");
        th.textContent = column;
        headRow.appendChild(th);
      }

      thead.appendChild(headRow);
      table.appendChild(thead);

      const tbody = document.createElement("tbody");

      for (const row of rows) {
        const tr = document.createElement("tr");

        for (const column of columns) {
          const td = document.createElement("td");
          td.textContent = row?.[column] ?? "";
          tr.appendChild(td);
        }

        tbody.appendChild(tr);
      }

      table.appendChild(tbody);
      tableWrap.appendChild(table);

      return tableWrap;
    }


    function renderResults(records) {
      resultsEl.innerHTML = "";

      if (!records || records.length === 0) {
        resultsEl.innerHTML = '<div class="muted">No game records found.</div>';
        return;
      }

      for (const record of records) {
        const card = document.createElement("div");
        card.className = "result-item";

        const title = document.createElement("h4");
        title.textContent = `${record.school} vs ${record.opponent}`;

        const meta = document.createElement("div");
        meta.className = "small";
        meta.textContent =
          `Date: ${record.date} | Home: ${record.home_team} | Away: ${record.away_team}`;

        const boxscore = buildDetailLine("Boxscore", record.boxscore_url);
        const pdf = buildDetailLine("PDF", record.pdf_url);
        const yearLine = buildDetailLine("Year", record.year);

        const actionRow = document.createElement("div");
        actionRow.className = "action-row";

        const parseBtn = document.createElement("button");
        parseBtn.textContent = "Parse Game";

        const reviewBtn = document.createElement("a");
        reviewBtn.className = "link-button";
        reviewBtn.textContent = "Open Review";
        reviewBtn.href = "#";
        reviewBtn.setAttribute("aria-disabled", "true");

        const excelLink = document.createElement("a");
        excelLink.className = "download-link";
        excelLink.textContent = "Download Excel";
        excelLink.href = "#";
        excelLink.target = "_blank";
        excelLink.rel = "noopener noreferrer";
        excelLink.setAttribute("aria-disabled", "true");

        actionRow.appendChild(parseBtn);
        actionRow.appendChild(reviewBtn);
        actionRow.appendChild(excelLink);

        const output = document.createElement("div");
        output.className = "small output";

        const reviewWrap = document.createElement("div");
        reviewWrap.className = "review-wrap";

        const reviewGrid = document.createElement("div");
        reviewGrid.className = "review-grid";

        const pdfPanel = document.createElement("div");
        pdfPanel.className = "review-panel";

        const pdfPanelTitle = document.createElement("h5");
        pdfPanelTitle.textContent = "Original PDF";

        const reviewFrame = document.createElement("iframe");
        reviewFrame.className = "review-frame";
        reviewFrame.title = `PDF review for ${record.school} vs ${record.opponent}`;

        pdfPanel.appendChild(pdfPanelTitle);
        pdfPanel.appendChild(reviewFrame);

        const tablePanel = document.createElement("div");
        tablePanel.className = "review-panel";

        const tablePanelTitle = document.createElement("h5");
        tablePanelTitle.textContent = "Parsed Spreadsheet Preview";

        const tableHost = document.createElement("div");
        tableHost.className = "review-empty";
        tableHost.textContent = "Run the parser to load preview rows.";

        tablePanel.appendChild(tablePanelTitle);
        tablePanel.appendChild(tableHost);

        reviewGrid.appendChild(pdfPanel);
        reviewGrid.appendChild(tablePanel);
        reviewWrap.appendChild(reviewGrid);

        parseBtn.addEventListener("click", async () => {
          try {
            parseBtn.disabled = true;

            output.className = "small output";
            output.textContent = "Parsing PDF and preparing review view...";

            const resp = await fetch("/api/parse-pdf", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ record })
            });

            const data = await resp.json();

            if (!resp.ok || !data.ok) {
              const detail = data.detail ? ` (${data.detail})` : "";
              throw new Error((data.error || "Failed to parse PDF") + detail);
            }

            const pdfPreviewUrl =
              data.pdf_preview_url ||
              data.preview_url ||
              record.pdf_url ||
              "";

            if (pdfPreviewUrl) {
              reviewFrame.src = pdfPreviewUrl;
            }

            if (data.excel_download_url) {
              excelLink.href = data.excel_download_url;
              excelLink.setAttribute("aria-disabled", "false");
            }

            reviewBtn.setAttribute("aria-disabled", "false");

            const rows = normalizeRows(data);
            const columns = normalizeColumns(data, rows);

            tableHost.innerHTML = "";
            tableHost.className = "";
            tableHost.appendChild(buildReviewTable(columns, rows));

            reviewWrap.classList.add("open");
            reviewBtn.textContent = "Hide Review";

            output.className = "small output success-text";
            output.textContent = `Parsed successfully: ${data.filename || "Excel output ready"}`;

          } catch (err) {
            output.className = "small output error-text";
            output.textContent = `Error: ${err.message}`;
          } finally {
            parseBtn.disabled = false;
          }
        });

        reviewBtn.addEventListener("click", (event) => {
          event.preventDefault();

          if (reviewBtn.getAttribute("aria-disabled") === "true") {
            return;
          }

          reviewWrap.classList.toggle("open");

          if (reviewWrap.classList.contains("open")) {
            reviewBtn.textContent = "Hide Review";
          } else {
            reviewBtn.textContent = "Open Review";
          }
        });

        excelLink.addEventListener("click", (event) => {
          if (excelLink.getAttribute("aria-disabled") === "true") {
            event.preventDefault();
          }
        });

        card.appendChild(title);
        card.appendChild(meta);
        card.appendChild(yearLine);
        card.appendChild(boxscore);
        card.appendChild(pdf);
        card.appendChild(actionRow);
        card.appendChild(output);
        card.appendChild(reviewWrap);

        resultsEl.appendChild(card);
      }
    }


    async function runDiscovery() {
      try {
        runBtn.disabled = true;
        resultsEl.innerHTML = "";

        setStatus("Finding games and PDF records across the selected year range...");

        const selectedSchools = getSelectedSchools();

        const startYear = Number(startYearInput.value);
        const endYear = Number(endYearInput.value);

        if (!Number.isInteger(startYear) || !Number.isInteger(endYear)) {
          throw new Error("Start Year and End Year must both be valid integers.");
        }

        if (startYear > endYear) {
          throw new Error("Start Year cannot be greater than End Year.");
        }

        const payload = {
          start_year: startYear,
          end_year: endYear,
          schools: selectedSchools.length > 0 ? selectedSchools : null,
          limit_links: Number(limitLinksInput.value || 0)
        };

        const resp = await fetch("/api/find-pdfs", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });

        const data = await resp.json();

        if (!resp.ok || !data.ok) {
          const detail = data.detail ? ` (${data.detail})` : "";
          throw new Error((data.error || "Failed to find PDFs") + detail);
        }

        renderResults(data.results);

        setStatus(
          `Found ${data.count} game record(s) from ${startYear} through ${endYear}. Click "Parse Game" to generate Excel output.`
        );

      } catch (err) {
        resultsEl.innerHTML = '<div class="muted">No results.</div>';
        setStatus(`Error finding PDFs: ${err.message}`);
      } finally {
        runBtn.disabled = false;
      }
    }


    runBtn.addEventListener("click", runDiscovery);
    loadSchools();

  </script>

</body>
</html>
