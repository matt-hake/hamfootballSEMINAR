<!doctype html>
<html lang="en">
<head>

  <meta charset="utf-8" />
  <title>NESCAC Parser Pipeline Demo</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <style>

    /* ------------------------------------------------------------
       Page layout styling

       CITE: ChatGPT was used to procure a template for UI demos and
       to streamline the documentation process.
       ------------------------------------------------------------ */

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      max-width: 1500px;
      margin: 32px auto;
      padding: 0 20px;
      background: #f7f7f7;
      color: #111;
    }

    h1 {
      font-size: 2.5rem;
      margin-bottom: 24px;
    }

    .card {
      background: white;
      border: 1px solid #ddd;
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 24px;
      box-shadow: 0 1px 2px rgba(0,0,0,0.04);
    }

    .row {
      display: flex;
      gap: 20px;
      align-items: center;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }

    .schools-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 10px;
      margin-top: 12px;
      margin-bottom: 20px;
    }

    label.checkbox {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #fafafa;
      border: 1px solid #e3e3e3;
      border-radius: 10px;
      padding: 10px 12px;
    }

    button {
      background: #222;
      color: white;
      border: none;
      border-radius: 12px;
      padding: 12px 20px;
      font-size: 1rem;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .muted {
      color: #555;
    }

    .result-list {
      display: grid;
      gap: 12px;
      margin-top: 16px;
    }

    .result-item {
      border: 1px solid #ddd;
      border-radius: 12px;
      padding: 16px;
      background: #fcfcfc;
    }

    .result-item h4 {
      margin: 0 0 8px 0;
    }

    .small {
      font-size: 0.95rem;
      color: #555;
      word-break: break-word;
    }

    .status {
      white-space: pre-wrap;
    }

    .action-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 12px;
      align-items: center;
    }

    .link-button,
    .download-link {
      display: inline-block;
      text-decoration: none;
      background: #efefef;
      color: #111;
      border: 1px solid #d4d4d4;
      border-radius: 10px;
      padding: 10px 14px;
      font-weight: 600;
    }

    .link-button[aria-disabled="true"],
    .download-link[aria-disabled="true"] {
      opacity: 0.5;
      pointer-events: none;
    }

    .output {
      margin-top: 10px;
    }

    .error-text {
      color: #9f1d1d;
      font-weight: 600;
    }

    .success-text {
      color: #166534;
      font-weight: 600;
    }

    .review-wrap {
      margin-top: 14px;
      display: none;
    }

    .review-wrap.open {
      display: block;
    }

    /* ------------------------------------------------------------
       Side-by-side PDF preview + editable HITL review
       ------------------------------------------------------------ */

    .review-grid {
      display: grid;
      grid-template-columns: minmax(560px, 1.2fr) minmax(420px, 0.9fr);
      gap: 16px;
      align-items: start;
    }

    .review-panel {
      background: white;
      border: 1px solid #ddd;
      border-radius: 12px;
      padding: 12px;
    }

    .review-panel h5 {
      margin: 0 0 10px 0;
      font-size: 1rem;
    }

    .pdf-toolbar {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
      margin-bottom: 10px;
    }

    .review-frame {
      width: 100%;
      height: 760px;
      border: 1px solid #ddd;
      border-radius: 12px;
      background: white;
    }

    .review-empty {
      padding: 12px;
      color: #555;
    }

    /* ------------------------------------------------------------
       HITL side panel styling

       NEW:
       The editable review UI lives beside the PDF instead of inside
       a fullscreen modal. This lets users preview the PDF while editing
       the rows they are about to download.
       ------------------------------------------------------------ */

    .hitl-container {
      background: #d1e3f8;
      border-radius: 12px;
      padding: 18px;
      min-height: 720px;
    }

    .hitl-jump-row {
      display: flex;
      gap: 10px;
      align-items: center;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }

    .hitl-jump-row label {
      font-weight: 700;
    }

    .hitl-jump-row select {
      flex: 1;
      min-width: 220px;
      padding: 9px 10px;
      border-radius: 8px;
      border: 1px solid #999;
      background: white;
    }

    .hitl-progress {
      font-size: 0.95rem;
      color: #333;
      margin-bottom: 12px;
      font-weight: 600;
    }

    .hitl-raw-text {
      font-size: 1.05rem;
      margin-bottom: 18px;
      line-height: 1.4;
      color: #000;
      background: white;
      border: 1px solid #aac3e0;
      border-radius: 8px;
      padding: 12px;
      min-height: 80px;
      max-height: 150px;
      overflow: auto;
    }

    .hitl-edit-header {
      text-align: center;
      font-size: 1rem;
      margin-bottom: 10px;
      font-weight: 600;
    }

    .hitl-grid {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .hitl-row {
      display: flex;
      align-items: stretch;
      gap: 10px;
    }

    .hitl-label {
      background: #6d93d6;
      color: #000;
      width: 135px;
      padding: 10px;
      text-align: center;
      font-weight: bold;
      border: 1px solid #4a6fa5;
      border-radius: 4px;
      overflow-wrap: anywhere;
    }

    .hitl-input {
      flex-grow: 1;
      background: #f4f4f4;
      border: 1px solid #ccc;
      padding: 10px;
      font-size: 1rem;
      text-align: center;
      border-radius: 4px;
      min-width: 0;
    }

    .hitl-controls {
      display: flex;
      gap: 10px;
      margin-top: 18px;
      align-items: center;
      flex-wrap: wrap;
    }

    .hitl-check-btn {
      background: #7ca55a;
      color: #111;
      border: 1px solid #5d7c43;
      font-size: 1.05rem;
    }

    .hitl-save-status {
      margin-top: 12px;
      font-size: 0.95rem;
      font-weight: 600;
    }

    .download-warning {
      margin-top: 10px;
      padding: 10px 12px;
      border-radius: 8px;
      background: #fff7ed;
      border: 1px solid #fed7aa;
      color: #7c2d12;
      font-size: 0.95rem;
    }

    @media (max-width: 1100px) {
      .review-grid {
        grid-template-columns: 1fr;
      }

      .review-frame {
        height: 580px;
      }
    }

  </style>
</head>

<body>

  <h1>NESCAC Parser Pipeline Demo</h1>

  <div class="card">

    <div class="row">

      <label>
        Start Year:
        <input id="start-year" type="number" value="2021" />
      </label>

      <label>
        End Year:
        <input id="end-year" type="number" value="2025" />
      </label>

      <label>
        Limit links (demo safety):
        <input id="limit-links" type="number" value="0" min="0" />
      </label>

    </div>

    <p class="muted">
      Choose a year range to scrape multiple seasons at once.
    </p>

    <h2>Schools</h2>
    <p class="muted">If none selected, runs all schools.</p>

    <div id="schools-container" class="schools-grid">
      <div class="muted">Loading schools...</div>
    </div>

    <button id="run-btn">Find Games</button>

  </div>

  <div class="card">
    <h2>Status</h2>
    <div id="status" class="status">Idle.</div>
  </div>

  <div class="card">
    <h2>Discovered Games</h2>

    <div id="results" class="result-list">
      <div class="muted">No results yet.</div>
    </div>
  </div>

  <script>

    /* ------------------------------------------------------------
       DOM references
       ------------------------------------------------------------ */

    const schoolsContainer = document.getElementById("schools-container");
    const runBtn = document.getElementById("run-btn");
    const statusEl = document.getElementById("status");
    const resultsEl = document.getElementById("results");

    const startYearInput = document.getElementById("start-year");
    const endYearInput = document.getElementById("end-year");
    const limitLinksInput = document.getElementById("limit-links");

    /* ------------------------------------------------------------
       Small helpers
       ------------------------------------------------------------ */

    function setStatus(message) {
      statusEl.textContent = message;
    }

    function getSelectedSchools() {
      const checked = document.querySelectorAll('input[name="schools"]:checked');
      return Array.from(checked).map((el) => el.value);
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#39;");
    }

    function normalizeRows(data) {
      return data.rows || data.table_rows || data.preview_rows || [];
    }

    function normalizeColumns(data, rows) {
      if (Array.isArray(data.columns) && data.columns.length > 0) {
        return data.columns;
      }

      if (rows.length > 0 && typeof rows[0] === "object" && rows[0] !== null) {
        return Object.keys(rows[0]);
      }

      return [];
    }

    function buildDetailLine(label, value) {
      const div = document.createElement("div");
      div.className = "small";
      div.textContent = `${label}: ${value ?? ""}`;
      return div;
    }

    function getPlayLabel(row, index) {
      /*
        Build a readable label for the play navigation menu.

        Uses "play #" if available; otherwise falls back to row number.
      */
      const playNumber = row["play #"] ?? row["Play #"] ?? row["Play"] ?? index + 1;
      const verified = row["HUMAN VERIFIED?"] === "Yes" ? "✅" : "❌";

      const rawPreview = String(row["Raw Text"] || "")
        .slice(0, 70)
        .replace(/\s+/g, " ")
        .trim();

      if (rawPreview) {
        return `Play ${playNumber} ${verified} — ${rawPreview}`;
      }

      return `Play ${playNumber} ${verified}`;
    }

    /* ------------------------------------------------------------
       School loading / rendering
       ------------------------------------------------------------ */

    function renderSchools(schools) {
      schoolsContainer.innerHTML = "";

      if (!schools || schools.length === 0) {
        schoolsContainer.innerHTML = '<div class="muted">No schools returned by API.</div>';
        return;
      }

      for (const school of schools) {
        const label = document.createElement("label");
        label.className = "checkbox";

        const input = document.createElement("input");
        input.type = "checkbox";
        input.name = "schools";
        input.value = school;

        const span = document.createElement("span");
        span.textContent = school;

        label.appendChild(input);
        label.appendChild(span);

        schoolsContainer.appendChild(label);
      }
    }

    async function loadSchools() {
      try {
        setStatus("Loading schools...");

        const resp = await fetch("/api/schools");
        const data = await resp.json();

        if (!resp.ok || !data.ok) {
          throw new Error(data.error || "Failed to load schools");
        }

        renderSchools(data.schools);

        if (data.suggested_start_year) {
          startYearInput.value = data.suggested_start_year;
        }

        if (data.suggested_end_year) {
          endYearInput.value = data.suggested_end_year;
        }

        setStatus("Schools loaded.");

      } catch (err) {
        schoolsContainer.innerHTML =
          `<div class="muted">Failed to load schools: ${escapeHtml(err.message)}</div>`;

        setStatus(`Error loading schools: ${err.message}`);
      }
    }

    /* ------------------------------------------------------------
       Inline HITL editor
       ------------------------------------------------------------ */

    function buildInlineHITL(host, rows, columns, filename, excelLink, record) {
      /*
        Build a human-in-the-loop editor directly inside the review panel.

        The original PDF remains visible on the left. The user edits rows
        on the right, saves changes back into the generated Excel file,
        and can then download that edited Excel file.
      */

      let currentRows = rows;
      let currentFilename = filename;

      let editableCols = columns.filter((c) =>
        !["Raw Text", "HASH", "play #", "HUMAN VERIFIED?"].includes(c)
      );

      let rowIndex = currentRows.findIndex((r) => r["HUMAN VERIFIED?"] !== "Yes");

      if (rowIndex === -1) {
        rowIndex = 0;
      }

      let batchIndex = 0;
      let hasUnsavedChanges = false;

      const container = document.createElement("div");
      container.className = "hitl-container";

      const downloadWarning = document.createElement("div");
      downloadWarning.className = "download-warning";
      downloadWarning.textContent =
        "Preview and edit the extracted rows here. Click Save before downloading the Excel file.";

      const jumpRow = document.createElement("div");
      jumpRow.className = "hitl-jump-row";

      const jumpLabel = document.createElement("label");
      jumpLabel.textContent = "Go to play:";

      const jumpSelect = document.createElement("select");

      currentRows.forEach((row, index) => {
        const option = document.createElement("option");
        option.value = index;
        option.textContent = getPlayLabel(row, index);
        jumpSelect.appendChild(option);
      });

      jumpRow.appendChild(jumpLabel);
      jumpRow.appendChild(jumpSelect);

      const progressEl = document.createElement("div");
      progressEl.className = "hitl-progress";

      const rawTextEl = document.createElement("div");
      rawTextEl.className = "hitl-raw-text";

      const editHeader = document.createElement("div");
      editHeader.className = "hitl-edit-header";
      editHeader.textContent = "Click a field to edit the extracted value";

      const fieldsEl = document.createElement("div");
      fieldsEl.className = "hitl-grid";

      const controls = document.createElement("div");
      controls.className = "hitl-controls";

      const prevBtn = document.createElement("button");
      prevBtn.textContent = "Previous";

      const saveBtn = document.createElement("button");
      saveBtn.textContent = "Save Edits";

      const nextBtn = document.createElement("button");
      nextBtn.className = "hitl-check-btn";
      nextBtn.textContent = "✔ Save / Next";

      const saveStatus = document.createElement("div");
      saveStatus.className = "hitl-save-status";

      controls.appendChild(prevBtn);
      controls.appendChild(saveBtn);
      controls.appendChild(nextBtn);

      container.appendChild(downloadWarning);
      container.appendChild(jumpRow);
      container.appendChild(progressEl);
      container.appendChild(rawTextEl);
      container.appendChild(editHeader);
      container.appendChild(fieldsEl);
      container.appendChild(controls);
      container.appendChild(saveStatus);

      host.innerHTML = "";
      host.appendChild(container);

      function setSaveStatus(message, isError = false) {
        saveStatus.textContent = message;
        saveStatus.className = isError
          ? "hitl-save-status error-text"
          : "hitl-save-status success-text";
      }

      function markUnsaved() {
        hasUnsavedChanges = true;
        setSaveStatus("Unsaved edits. Click Save Edits or Save / Next before downloading.", true);
      }

      function saveVisibleInputsToMemory() {
        /*
          Copy visible input values into currentRows.

          This keeps the in-browser version updated even before a backend
          save happens.
        */
        const inputs = fieldsEl.querySelectorAll(".hitl-input");

        inputs.forEach((input) => {
          currentRows[rowIndex][input.dataset.col] = input.value;
        });
      }

      function refreshJumpMenuLabels() {
        Array.from(jumpSelect.options).forEach((option, index) => {
          option.textContent = getPlayLabel(currentRows[index], index);
        });
      }

      function renderCurrentRow() {
        if (!currentRows || currentRows.length === 0) {
          host.innerHTML = '<div class="review-empty">No parsed rows available for review.</div>';
          return;
        }

        const row = currentRows[rowIndex];

        const totalCols = editableCols.length;
        const batchSize = Math.ceil(totalCols / 3) || 1;
        const start = batchIndex * batchSize;
        const end = Math.min(start + batchSize, totalCols);
        const activeBatchCols = editableCols.slice(start, end);

        const verified = row["HUMAN VERIFIED?"] === "Yes" ? "✅ verified" : "❌ not verified";
        
        // ... inside renderCurrentRow() ...
        jumpSelect.value = String(rowIndex);

        // Grab the teams from the record object already passed to the frontend
        const schoolName = record.school || "Home";
        const opponentName = record.opponent || "Away";

        progressEl.innerHTML =
          `Row ${rowIndex + 1}/${currentRows.length} — ${verified}<br>` +
          `<b>Field group ${batchIndex + 1}/3</b><br><br>` +
          `<div style="background: #e2e8f0; border: 1px solid #cbd5e1; padding: 8px; border-radius: 6px; text-align: center; color: #0f172a;">` +
          `<strong>Legend:</strong> OFF = ${schoolName} &nbsp;|&nbsp; DEF = ${opponentName}` +
          `</div>`;

        rawTextEl.textContent = row["Raw Text"] || "No raw text was returned for this play.";


        fieldsEl.innerHTML = "";

        if (activeBatchCols.length === 0) {
          const empty = document.createElement("div");
          empty.className = "review-empty";
          empty.textContent = "No editable fields found for this row.";
          fieldsEl.appendChild(empty);
          return;
        }

        activeBatchCols.forEach((col) => {
          const rowDiv = document.createElement("div");
          rowDiv.className = "hitl-row";

          const label = document.createElement("div");
          label.className = "hitl-label";
          label.textContent = col;

          const input = document.createElement("input");
          input.className = "hitl-input";
          input.value = row[col] ?? "";
          input.dataset.col = col;

          input.addEventListener("input", () => {
            markUnsaved();
          });

          rowDiv.appendChild(label);
          rowDiv.appendChild(input);
          fieldsEl.appendChild(rowDiv);
        });

        prevBtn.disabled = rowIndex === 0 && batchIndex === 0;
      }

      async function saveToExcel() {
        /*
          Persist the edited in-browser rows to the Excel file.

          After this succeeds, the existing Download Excel link points
          to the updated file on the backend.
        */
        saveVisibleInputsToMemory();
        setSaveStatus("Saving edits to Excel...");

        const resp = await fetch("/api/update-excel", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            filename: currentFilename,
            rows: currentRows
          })
        });

        const result = await resp.json();

        if (!resp.ok || !result.ok) {
          throw new Error(result.error || "Failed to save Excel changes.");
        }

        hasUnsavedChanges = false;
        refreshJumpMenuLabels();
        setSaveStatus("Saved. The Download Excel button now points to the edited file.");
      }

      jumpSelect.addEventListener("change", () => {
        /*
          Let the user jump directly to a specific play.

          This saves visible inputs to memory before moving, but does not
          write to Excel until Save Edits or Save / Next is clicked.
        */
        saveVisibleInputsToMemory();

        rowIndex = Number(jumpSelect.value);
        batchIndex = 0;

        renderCurrentRow();

        if (hasUnsavedChanges) {
          setSaveStatus("Unsaved edits. Click Save Edits before downloading.", true);
        } else {
          setSaveStatus("");
        }
      });

      nextBtn.addEventListener("click", async () => {
        try {
          saveVisibleInputsToMemory();

          batchIndex++;

          if (batchIndex >= 3) {
            currentRows[rowIndex]["HUMAN VERIFIED?"] = "Yes";
            batchIndex = 0;
            rowIndex++;
          }

          if (rowIndex >= currentRows.length) {
            rowIndex = currentRows.length - 1;
            await saveToExcel();
            setSaveStatus("All rows reviewed and saved. You can now download the edited Excel file.");
            renderCurrentRow();
            return;
          }

          await saveToExcel();
          renderCurrentRow();

        } catch (err) {
          setSaveStatus(`Save failed: ${err.message}`, true);
        }
      });

      prevBtn.addEventListener("click", () => {
        saveVisibleInputsToMemory();

        if (batchIndex > 0) {
          batchIndex--;
        } else if (rowIndex > 0) {
          rowIndex--;
          batchIndex = 2;
        }

        renderCurrentRow();

        if (hasUnsavedChanges) {
          setSaveStatus("Unsaved edits. Click Save Edits before downloading.", true);
        } else {
          setSaveStatus("");
        }
      });

      saveBtn.addEventListener("click", async () => {
        try {
          await saveToExcel();
          renderCurrentRow();
        } catch (err) {
          setSaveStatus(`Save failed: ${err.message}`, true);
        }
      });

      /*
        Prevent accidental download when the user has typed edits but
        has not saved them back to the Excel file yet.
      */
      excelLink.addEventListener("click", (event) => {
        if (hasUnsavedChanges) {
          event.preventDefault();
          setSaveStatus("Please save your edits before downloading.", true);
        }
      });

      renderCurrentRow();
    }

    /* ------------------------------------------------------------
       Result rendering
       ------------------------------------------------------------ */

    function renderResults(records) {
      resultsEl.innerHTML = "";

      if (!records || records.length === 0) {
        resultsEl.innerHTML = '<div class="muted">No game records found.</div>';
        return;
      }

      for (const record of records) {
        const card = document.createElement("div");
        card.className = "result-item";

        const title = document.createElement("h4");
        title.textContent = `${record.school} vs ${record.opponent}`;

        const meta = document.createElement("div");
        meta.className = "small";
        meta.textContent =
          `Date: ${record.date} | Home: ${record.home_team} | Away: ${record.away_team}`;

        const boxscore = buildDetailLine("Boxscore", record.boxscore_url);
        const pdf = buildDetailLine("PDF", record.pdf_url);
        const yearLine = buildDetailLine("Year", record.year);

        const actionRow = document.createElement("div");
        actionRow.className = "action-row";

        const parseBtn = document.createElement("button");
        parseBtn.textContent = "Parse Game";

        const reviewBtn = document.createElement("a");
        reviewBtn.className = "link-button";
        reviewBtn.textContent = "Open Preview + Edit";
        reviewBtn.href = "#";
        reviewBtn.setAttribute("aria-disabled", "true");

        const excelLink = document.createElement("a");
        excelLink.className = "download-link";
        excelLink.textContent = "Download Edited Excel";
        excelLink.href = "#";
        excelLink.target = "_blank";
        excelLink.rel = "noopener noreferrer";
        excelLink.setAttribute("aria-disabled", "true");

        actionRow.appendChild(parseBtn);
        actionRow.appendChild(reviewBtn);
        actionRow.appendChild(excelLink);

        const output = document.createElement("div");
        output.className = "small output";

        const reviewWrap = document.createElement("div");
        reviewWrap.className = "review-wrap";

        const reviewGrid = document.createElement("div");
        reviewGrid.className = "review-grid";

        /*
          Left panel:
          The original PDF preview stays visible while the user edits.
        */
        const pdfPanel = document.createElement("div");
        pdfPanel.className = "review-panel";

        const pdfPanelTitle = document.createElement("h5");
        pdfPanelTitle.textContent = "Original PDF Preview";

        const pdfToolbar = document.createElement("div");
        pdfToolbar.className = "pdf-toolbar";

        const openPdfLink = document.createElement("a");
        openPdfLink.className = "link-button";
        openPdfLink.textContent = "Open PDF in New Tab";
        openPdfLink.href = "#";
        openPdfLink.target = "_blank";
        openPdfLink.rel = "noopener noreferrer";
        openPdfLink.setAttribute("aria-disabled", "true");

        pdfToolbar.appendChild(openPdfLink);

        const reviewFrame = document.createElement("iframe");
        reviewFrame.className = "review-frame";

        pdfPanel.appendChild(pdfPanelTitle);
        pdfPanel.appendChild(pdfToolbar);
        pdfPanel.appendChild(reviewFrame);

        /*
          Right panel:
          Editable human-in-the-loop review interface.
        */
        const hitlPanel = document.createElement("div");
        hitlPanel.className = "review-panel";

        const hitlPanelTitle = document.createElement("h5");
        hitlPanelTitle.textContent = "Human Review + Editable Download Preview";

        const hitlHost = document.createElement("div");
        hitlHost.className = "review-empty";
        hitlHost.textContent = "Run the parser to load editable play rows.";

        hitlPanel.appendChild(hitlPanelTitle);
        hitlPanel.appendChild(hitlHost);

        reviewGrid.appendChild(pdfPanel);
        reviewGrid.appendChild(hitlPanel);
        reviewWrap.appendChild(reviewGrid);

        parseBtn.addEventListener("click", async () => {
          try {
            parseBtn.disabled = true;
            output.className = "small output";
            output.textContent = "Parsing PDF and preparing editable preview...";

            const resp = await fetch("/api/parse-pdf", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ record })
            });

            const data = await resp.json();

            if (!resp.ok || !data.ok) {
              const detail = data.detail ? ` (${data.detail})` : "";
              throw new Error((data.error || "Failed to parse PDF") + detail);
            }

            const currentRows = normalizeRows(data);
            const currentCols = normalizeColumns(data, currentRows);
            const currentFilename = data.filename;

            const pdfPreviewUrl = data.pdf_preview_url || data.preview_url || record.pdf_url || "";

            if (pdfPreviewUrl) {
              reviewFrame.src = pdfPreviewUrl;
              openPdfLink.href = pdfPreviewUrl;
              openPdfLink.setAttribute("aria-disabled", "false");
            }

            if (data.excel_download_url) {
              excelLink.href = data.excel_download_url;
              excelLink.setAttribute("aria-disabled", "false");
            }

            buildInlineHITL(
              hitlHost,
              currentRows,
              currentCols,
              currentFilename,
              excelLink,
              record
            );

            reviewBtn.setAttribute("aria-disabled", "false");
            reviewWrap.classList.add("open");
            reviewBtn.textContent = "Hide Preview + Edit";

            output.className = "small output success-text";
            output.textContent =
              `Parsed successfully: ${data.filename || "Excel output ready"}. ` +
              "Review edits beside the PDF, save, then download the edited Excel file.";

          } catch (err) {
            output.className = "small output error-text";
            output.textContent = `Error: ${err.message}`;
          } finally {
            parseBtn.disabled = false;
          }
        });

        reviewBtn.addEventListener("click", (event) => {
          event.preventDefault();

          if (reviewBtn.getAttribute("aria-disabled") === "true") {
            return;
          }

          reviewWrap.classList.toggle("open");
          reviewBtn.textContent = reviewWrap.classList.contains("open")
            ? "Hide Preview + Edit"
            : "Open Preview + Edit";
        });

        excelLink.addEventListener("click", (event) => {
          if (excelLink.getAttribute("aria-disabled") === "true") {
            event.preventDefault();
          }
        });

        openPdfLink.addEventListener("click", (event) => {
          if (openPdfLink.getAttribute("aria-disabled") === "true") {
            event.preventDefault();
          }
        });

        card.appendChild(title);
        card.appendChild(meta);
        card.appendChild(yearLine);
        card.appendChild(boxscore);
        card.appendChild(pdf);
        card.appendChild(actionRow);
        card.appendChild(output);
        card.appendChild(reviewWrap);

        resultsEl.appendChild(card);
      }
    }

    /* ------------------------------------------------------------
       Discovery flow
       ------------------------------------------------------------ */

    async function runDiscovery() {
      try {
        runBtn.disabled = true;
        resultsEl.innerHTML = "";

        setStatus("Finding games and PDF records across the selected year range...");

        const selectedSchools = getSelectedSchools();

        const startYear = Number(startYearInput.value);
        const endYear = Number(endYearInput.value);

        if (!Number.isInteger(startYear) || !Number.isInteger(endYear)) {
          throw new Error("Start Year and End Year must both be valid integers.");
        }

        if (startYear > endYear) {
          throw new Error("Start Year cannot be greater than End Year.");
        }

        const payload = {
          start_year: startYear,
          end_year: endYear,
          schools: selectedSchools.length > 0 ? selectedSchools : null,
          limit_links: Number(limitLinksInput.value || 0)
        };

        const resp = await fetch("/api/find-pdfs", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });

        const data = await resp.json();

        if (!resp.ok || !data.ok) {
          const detail = data.detail ? ` (${data.detail})` : "";
          throw new Error((data.error || "Failed to find PDFs") + detail);
        }

        renderResults(data.results);

        setStatus(
          `Found ${data.count} game record(s) from ${startYear} through ${endYear}. ` +
          `Click "Parse Game" to preview the PDF, edit extracted plays, and download the edited Excel file.`
        );

      } catch (err) {
        resultsEl.innerHTML = '<div class="muted">No results.</div>';
        setStatus(`Error finding PDFs: ${err.message}`);
      } finally {
        runBtn.disabled = false;
      }
    }

    /* ------------------------------------------------------------
       App startup
       ------------------------------------------------------------ */

    runBtn.addEventListener("click", runDiscovery);
    loadSchools();

  </script>
