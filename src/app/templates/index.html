<!doctype html>
<html lang="en">
<head>

  <!-- Standard metadata -->
  <meta charset="utf-8" />
  <title>NESCAC Parser Pipeline Demo</title>

  <!-- Ensures proper scaling on mobile devices -->
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <style>

    /* ------------------------------------------------------------
       Page layout styling
       ------------------------------------------------------------ */

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      max-width: 1400px;
      margin: 32px auto;
      padding: 0 20px;
      background: #f7f7f7;
      color: #111;
    }

    h1 {
      font-size: 2.5rem;
      margin-bottom: 24px;
    }

    /* ------------------------------------------------------------
       Card container styling
       ------------------------------------------------------------ */

    .card {
      background: white;
      border: 1px solid #ddd;
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 24px;
      box-shadow: 0 1px 2px rgba(0,0,0,0.04);
    }

    /* Row layout for grouped controls near the top of the page */
    .row {
      display: flex;
      gap: 20px;
      align-items: center;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }

    /* Responsive checkbox grid for school selection */
    .schools-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 10px;
      margin-top: 12px;
      margin-bottom: 20px;
    }

    /* Styling for each school checkbox "card" */
    label.checkbox {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #fafafa;
      border: 1px solid #e3e3e3;
      border-radius: 10px;
      padding: 10px 12px;
    }

    /* Main button style */
    button {
      background: #222;
      color: white;
      border: none;
      border-radius: 12px;
      padding: 12px 20px;
      font-size: 1rem;
      cursor: pointer;
    }

    /* Disabled button state */
    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    /* Muted helper text */
    .muted {
      color: #555;
    }

    /* Vertical list of discovered game cards */
    .result-list {
      display: grid;
      gap: 12px;
      margin-top: 16px;
    }

    /* Individual discovered game card */
    .result-item {
      border: 1px solid #ddd;
      border-radius: 12px;
      padding: 16px;
      background: #fcfcfc;
    }

    .result-item h4 {
      margin: 0 0 8px 0;
    }

    /* Smaller text used for metadata and status within cards */
    .small {
      font-size: 0.95rem;
      color: #555;
      word-break: break-word;
    }

    /* Preserve line breaks in status text */
    .status {
      white-space: pre-wrap;
    }

    /* Container for action buttons/links inside each result card */
    .action-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 12px;
      align-items: center;
    }

    /* Shared button-like styling for anchors */
    .link-button,
    .download-link {
      display: inline-block;
      text-decoration: none;
      background: #efefef;
      color: #111;
      border: 1px solid #d4d4d4;
      border-radius: 10px;
      padding: 10px 14px;
      font-weight: 600;
    }

    /* Visual disabled state for anchors since <a> has no native disabled attribute */
    .link-button[aria-disabled="true"],
    .download-link[aria-disabled="true"] {
      opacity: 0.5;
      pointer-events: none;
    }

    /* Output/status text area under each game card */
    .output {
      margin-top: 10px;
    }

    /* Error styling */
    .error-text {
      color: #9f1d1d;
      font-weight: 600;
    }

    /* Success styling */
    .success-text {
      color: #166534;
      font-weight: 600;
    }

    /* Review panel is hidden until parsing finishes */
    .review-wrap {
      margin-top: 14px;
      display: none;
    }

    /* Once "open" class is added in JavaScript, show the review section */
    .review-wrap.open {
      display: block;
    }

    /* Side-by-side layout: PDF on one side, parsed table on the other */
    .review-grid {
      display: grid;
      grid-template-columns: 1.1fr 1fr;
      gap: 16px;
      align-items: start;
    }

    /* Panel styling for each side of the review area */
    .review-panel {
      background: white;
      border: 1px solid #ddd;
      border-radius: 12px;
      padding: 12px;
    }

    .review-panel h5 {
      margin: 0 0 10px 0;
      font-size: 1rem;
    }

    /* Embedded PDF frame */
    .review-frame {
      width: 100%;
      height: 700px;
      border: 1px solid #ddd;
      border-radius: 12px;
      background: white;
    }

    /* Scrollable wrapper for preview table */
    .table-wrap {
      max-height: 700px;
      overflow: auto;
      border: 1px solid #ddd;
      border-radius: 12px;
      background: white;
    }

    /* Table used to preview parsed spreadsheet rows */
    .review-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.9rem;
    }

    .review-table th,
    .review-table td {
      border-bottom: 1px solid #e5e5e5;
      padding: 8px 10px;
      text-align: left;
      vertical-align: top;
    }

    /* Sticky table header so column names remain visible while scrolling */
    .review-table th {
      position: sticky;
      top: 0;
      background: #f7f7f7;
      z-index: 1;
    }

    /* Placeholder text shown when no parsed rows are available yet */
    .review-empty {
      padding: 12px;
      color: #555;
    }

  </style>
</head>

<body>

  <h1>NESCAC Parser Pipeline Demo</h1>

  <div class="card">

    <div class="row">

      <!-- NEW: start year replaces single year input -->
      <label>
        Start Year:
        <input id="start-year" type="number" value="2021" />
      </label>

      <!-- NEW: end year replaces single year input -->
      <label>
        End Year:
        <input id="end-year" type="number" value="2025" />
      </label>

      <label>
        Limit links (demo safety):
        <input id="limit-links" type="number" value="0" min="0" />
      </label>

    </div>

    <p class="muted">
      Choose a year range to scrape multiple seasons at once.
    </p>

    <h2>Schools</h2>
    <p class="muted">If none selected, runs all schools.</p>

    <!-- This container is populated dynamically by JavaScript after /api/schools loads -->
    <div id="schools-container" class="schools-grid">
      <div class="muted">Loading schools...</div>
    </div>

    <button id="run-btn">Find Games</button>

  </div>

  <div class="card">
    <h2>Status</h2>
    <div id="status" class="status">Idle.</div>
  </div>

  <div class="card">
    <h2>Discovered Games</h2>

    <!-- JavaScript replaces this once results are returned -->
    <div id="results" class="result-list">
      <div class="muted">No results yet.</div>
    </div>
  </div>

  <script>

    /* ------------------------------------------------------------
       DOM references
       ------------------------------------------------------------ */

    /* Main containers and controls used throughout the script */
    const schoolsContainer = document.getElementById("schools-container");
    const runBtn = document.getElementById("run-btn");
    const statusEl = document.getElementById("status");
    const resultsEl = document.getElementById("results");

    /* NEW: start/end year inputs */
    const startYearInput = document.getElementById("start-year");
    const endYearInput = document.getElementById("end-year");

    /* Optional backend safety limit for discovery */
    const limitLinksInput = document.getElementById("limit-links");

    /* ------------------------------------------------------------
       Small helpers
       ------------------------------------------------------------ */

    function setStatus(message) {
      /*
        Update the main status panel with a user-facing message.
        This keeps the user informed about what the UI is currently doing.
      */
      statusEl.textContent = message;
    }

    function getSelectedSchools() {
      /*
        Read all checked school checkboxes and return their values
        as a plain JavaScript array of school names.
      */
      const checked = document.querySelectorAll('input[name="schools"]:checked');
      return Array.from(checked).map((el) => el.value);
    }

    function escapeHtml(value) {
      /*
        Escape user-visible text before inserting it into innerHTML.

        This is important whenever a string might contain special
        characters like < or >, because those could otherwise be
        interpreted as HTML markup instead of plain text.
      */
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#39;");
    }

    /* ------------------------------------------------------------
       School loading / rendering
       ------------------------------------------------------------ */

    function renderSchools(schools) {
      /*
        Fill the school checkbox grid using the list returned
        by the backend /api/schools endpoint.
      */
      schoolsContainer.innerHTML = "";

      if (!schools || schools.length === 0) {
        schoolsContainer.innerHTML = '<div class="muted">No schools returned by API.</div>';
        return;
      }

      for (const school of schools) {
        /*
          Build each checkbox row manually so the page does not rely
          on raw HTML string concatenation for this section.
        */
        const label = document.createElement("label");
        label.className = "checkbox";

        const input = document.createElement("input");
        input.type = "checkbox";
        input.name = "schools";
        input.value = school;

        const span = document.createElement("span");
        span.textContent = school;

        label.appendChild(input);
        label.appendChild(span);

        schoolsContainer.appendChild(label);
      }
    }

    async function loadSchools() {
      /*
        Load valid school names and suggested year defaults from the backend.

        The backend response also provides suggested_start_year and
        suggested_end_year so the frontend stays aligned with the API's
        notion of a sensible multi-year range.
      */
      try {
        setStatus("Loading schools...");

        const resp = await fetch("/api/schools");
        const data = await resp.json();

        if (!resp.ok || !data.ok) {
          throw new Error(data.error || "Failed to load schools");
        }

        renderSchools(data.schools);

        /* NEW:
           use backend-provided defaults for multi-year mode */
        if (data.suggested_start_year) {
          startYearInput.value = data.suggested_start_year;
        }

        if (data.suggested_end_year) {
          endYearInput.value = data.suggested_end_year;
        }

        setStatus("Schools loaded.");

      } catch (err) {
        /*
          We use innerHTML here because the message includes a small
          wrapper element. The actual error text is escaped first.
        */
        schoolsContainer.innerHTML =
          `<div class="muted">Failed to load schools: ${escapeHtml(err.message)}</div>`;

        setStatus(`Error loading schools: ${err.message}`);
      }
    }

    /* ------------------------------------------------------------
       Result formatting helpers
       ------------------------------------------------------------ */

    function buildDetailLine(label, value) {
      /*
        Build a small metadata line like:
        "Boxscore: https://..."
      */
      const div = document.createElement("div");
      div.className = "small";
      div.textContent = `${label}: ${value ?? ""}`;
      return div;
    }

    function normalizeRows(data) {
      /*
        Accept multiple possible backend field names for preview rows.

        This makes the frontend more tolerant if the backend response
        shape changes slightly, for example:
        - rows
        - table_rows
        - preview_rows
      */
      return data.rows || data.table_rows || data.preview_rows || [];
    }

    function normalizeColumns(data, rows) {
      /*
        Prefer explicit column definitions from the backend.
        If they are not present, infer columns from the first row object.
      */
      if (Array.isArray(data.columns) && data.columns.length > 0) {
        return data.columns;
      }

      if (rows.length > 0 && typeof rows[0] === "object" && rows[0] !== null) {
        return Object.keys(rows[0]);
      }

      return [];
    }

    function buildReviewTable(columns, rows) {
      /*
        Build the parsed spreadsheet preview table shown on the right side
        of the review interface.
      */
      const tableWrap = document.createElement("div");
      tableWrap.className = "table-wrap";

      if (!rows || rows.length === 0) {
        /*
          If the parser returned no preview data, show a clear placeholder
          instead of rendering an empty table.
        */
        const empty = document.createElement("div");
        empty.className = "review-empty";
        empty.textContent = "No parsed rows were returned by the parser.";
        tableWrap.appendChild(empty);
        return tableWrap;
      }

      const table = document.createElement("table");
      table.className = "review-table";

      const thead = document.createElement("thead");
      const headRow = document.createElement("tr");

      for (const column of columns) {
        const th = document.createElement("th");
        th.textContent = column;
        headRow.appendChild(th);
      }

      thead.appendChild(headRow);
      table.appendChild(thead);

      const tbody = document.createElement("tbody");

      for (const row of rows) {
        const tr = document.createElement("tr");

        for (const column of columns) {
          const td = document.createElement("td");

          /*
            Optional chaining (row?.[column]) safely handles cases where
            row is null/undefined without throwing an error.
          */
          td.textContent = row?.[column] ?? "";
          tr.appendChild(td);
        }

        tbody.appendChild(tr);
      }

      table.appendChild(tbody);
      tableWrap.appendChild(table);

      return tableWrap;
    }

    /* ------------------------------------------------------------
       Result rendering
       ------------------------------------------------------------ */

    function renderResults(records) {
      /*
        Render one result card per discovered game/PDF record.

        Each card includes:
        - metadata
        - Parse Game button
        - review toggle
        - Excel download link
        - hidden side-by-side review area
      */
      resultsEl.innerHTML = "";

      if (!records || records.length === 0) {
        resultsEl.innerHTML = '<div class="muted">No game records found.</div>';
        return;
      }

      for (const record of records) {
        const card = document.createElement("div");
        card.className = "result-item";

        const title = document.createElement("h4");
        title.textContent = `${record.school} vs ${record.opponent}`;

        const meta = document.createElement("div");
        meta.className = "small";
        meta.textContent =
          `Date: ${record.date} | Home: ${record.home_team} | Away: ${record.away_team}`;

        const boxscore = buildDetailLine("Boxscore", record.boxscore_url);
        const pdf = buildDetailLine("PDF", record.pdf_url);
        const yearLine = buildDetailLine("Year", record.year);

        const actionRow = document.createElement("div");
        actionRow.className = "action-row";

        const parseBtn = document.createElement("button");
        parseBtn.textContent = "Parse Game";

        const reviewBtn = document.createElement("a");
        reviewBtn.className = "link-button";
        reviewBtn.textContent = "Open Review";
        reviewBtn.href = "#";

        /*
          Since anchor elements do not support the disabled attribute,
          aria-disabled gives us a semantic flag we can check in JS/CSS.
        */
        reviewBtn.setAttribute("aria-disabled", "true");

        const excelLink = document.createElement("a");
        excelLink.className = "download-link";
        excelLink.textContent = "Download Excel";
        excelLink.href = "#";
        excelLink.target = "_blank";
        excelLink.rel = "noopener noreferrer";

        /*
          rel="noopener noreferrer" is a security best practice when using
          target="_blank", because it prevents the new tab from getting a
          direct handle back to the opener page.
        */
        excelLink.setAttribute("aria-disabled", "true");

        actionRow.appendChild(parseBtn);
        actionRow.appendChild(reviewBtn);
        actionRow.appendChild(excelLink);

        const output = document.createElement("div");
        output.className = "small output";

        /*
          This wrapper stays hidden until parsing succeeds.
          Then it becomes a side-by-side PDF/table review area.
        */
        const reviewWrap = document.createElement("div");
        reviewWrap.className = "review-wrap";

        const reviewGrid = document.createElement("div");
        reviewGrid.className = "review-grid";

        const pdfPanel = document.createElement("div");
        pdfPanel.className = "review-panel";

        const pdfPanelTitle = document.createElement("h5");
        pdfPanelTitle.textContent = "Original PDF";

        const reviewFrame = document.createElement("iframe");
        reviewFrame.className = "review-frame";
        reviewFrame.title = `PDF review for ${record.school} vs ${record.opponent}`;

        pdfPanel.appendChild(pdfPanelTitle);
        pdfPanel.appendChild(reviewFrame);

        const tablePanel = document.createElement("div");
        tablePanel.className = "review-panel";

        const tablePanelTitle = document.createElement("h5");
        tablePanelTitle.textContent = "Parsed Spreadsheet Preview";

        const tableHost = document.createElement("div");
        tableHost.className = "review-empty";
        tableHost.textContent = "Run the parser to load preview rows.";

        tablePanel.appendChild(tablePanelTitle);
        tablePanel.appendChild(tableHost);

        reviewGrid.appendChild(pdfPanel);
        reviewGrid.appendChild(tablePanel);
        reviewWrap.appendChild(reviewGrid);

        parseBtn.addEventListener("click", async () => {
          /*
            Parse flow for one discovered game:
            1. Disable the button
            2. POST the record to /api/parse-pdf
            3. Load the returned PDF preview + table preview
            4. Enable review/download controls
          */
          try {
            parseBtn.disabled = true;

            output.className = "small output";
            output.textContent = "Parsing PDF and preparing review view...";

            const resp = await fetch("/api/parse-pdf", {
              method: "POST",
              headers: { "Content-Type": "application/json" },

              /*
                Send the selected backend record back to the API so the
                backend knows exactly which discovered game to download/parse.
              */
              body: JSON.stringify({ record })
            });

            const data = await resp.json();

            if (!resp.ok || !data.ok) {
              const detail = data.detail ? ` (${data.detail})` : "";
              throw new Error((data.error || "Failed to parse PDF") + detail);
            }

            /*
              Prefer backend-local preview URLs when available.
              Fall back to older field names or the original PDF URL.
            */
            const pdfPreviewUrl =
              data.pdf_preview_url ||
              data.preview_url ||
              record.pdf_url ||
              "";

            if (pdfPreviewUrl) {
              reviewFrame.src = pdfPreviewUrl;
            }

            /*
              Once the Excel file is ready, activate the download link.
            */
            if (data.excel_download_url) {
              excelLink.href = data.excel_download_url;
              excelLink.setAttribute("aria-disabled", "false");
            }

            /*
              Once parse succeeds, allow the user to open/close the review area.
            */
            reviewBtn.setAttribute("aria-disabled", "false");

            const rows = normalizeRows(data);
            const columns = normalizeColumns(data, rows);

            /*
              Replace the placeholder text with the generated preview table.
            */
            tableHost.innerHTML = "";
            tableHost.className = "";
            tableHost.appendChild(buildReviewTable(columns, rows));

            reviewWrap.classList.add("open");
            reviewBtn.textContent = "Hide Review";

            output.className = "small output success-text";
            output.textContent = `Parsed successfully: ${data.filename || "Excel output ready"}`;

          } catch (err) {
            output.className = "small output error-text";
            output.textContent = `Error: ${err.message}`;
          } finally {
            /*
              Re-enable parse button whether request succeeded or failed.
            */
            parseBtn.disabled = false;
          }
        });

        reviewBtn.addEventListener("click", (event) => {
          /*
            Toggle the side-by-side review section open/closed.
          */
          event.preventDefault();

          if (reviewBtn.getAttribute("aria-disabled") === "true") {
            return;
          }

          reviewWrap.classList.toggle("open");

          if (reviewWrap.classList.contains("open")) {
            reviewBtn.textContent = "Hide Review";
          } else {
            reviewBtn.textContent = "Open Review";
          }
        });

        excelLink.addEventListener("click", (event) => {
          /*
            Prevent clicking the Excel download link before it has been activated.
          */
          if (excelLink.getAttribute("aria-disabled") === "true") {
            event.preventDefault();
          }
        });

        card.appendChild(title);
        card.appendChild(meta);
        card.appendChild(yearLine);
        card.appendChild(boxscore);
        card.appendChild(pdf);
        card.appendChild(actionRow);
        card.appendChild(output);
        card.appendChild(reviewWrap);

        resultsEl.appendChild(card);
      }
    }

    /* ------------------------------------------------------------
       Discovery flow
       ------------------------------------------------------------ */

    async function runDiscovery() {
      /*
        Main "Find Games" workflow:
        1. Read user input
        2. Validate year range
        3. POST to /api/find-pdfs
        4. Render discovered results
      */
      try {
        runBtn.disabled = true;
        resultsEl.innerHTML = "";

        setStatus("Finding games and PDF records across the selected year range...");

        const selectedSchools = getSelectedSchools();

        const startYear = Number(startYearInput.value);
        const endYear = Number(endYearInput.value);

        /*
          Number(...) converts the input text into numeric form.
          Number.isInteger(...) ensures the result is a real integer.
        */
        if (!Number.isInteger(startYear) || !Number.isInteger(endYear)) {
          throw new Error("Start Year and End Year must both be valid integers.");
        }

        if (startYear > endYear) {
          throw new Error("Start Year cannot be greater than End Year.");
        }

        /*
          If no schools are selected, send null so the backend knows
          to run all schools rather than an empty list.
        */
        const payload = {
          start_year: startYear,
          end_year: endYear,
          schools: selectedSchools.length > 0 ? selectedSchools : null,
          limit_links: Number(limitLinksInput.value || 0)
        };

        const resp = await fetch("/api/find-pdfs", {
          method: "POST",
          headers: { "Content-Type": "application/json" },

          /*
            JSON.stringify converts the JavaScript object payload into
            a JSON string suitable for the POST request body.
          */
          body: JSON.stringify(payload)
        });

        const data = await resp.json();

        if (!resp.ok || !data.ok) {
          const detail = data.detail ? ` (${data.detail})` : "";
          throw new Error((data.error || "Failed to find PDFs") + detail);
        }

        renderResults(data.results);

        setStatus(
          `Found ${data.count} game record(s) from ${startYear} through ${endYear}. Click "Parse Game" to generate Excel output.`
        );

      } catch (err) {
        resultsEl.innerHTML = '<div class="muted">No results.</div>';
        setStatus(`Error finding PDFs: ${err.message}`);
      } finally {
        runBtn.disabled = false;
      }
    }

    /* ------------------------------------------------------------
       App startup
       ------------------------------------------------------------ */

    /*
      Wire up the main button and immediately load school options
      when the page first opens.
    */
    runBtn.addEventListener("click", runDiscovery);
    loadSchools();

  </script>

</body>
</html>
