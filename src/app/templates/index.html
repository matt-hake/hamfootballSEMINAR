<!doctype html>
<html lang="en">
<head>

  <!-- Standard metadata -->
  <meta charset="utf-8" />
  <title>NESCAC Parser Pipeline Demo</title> <!-- /* NEW AS OF 4/1 */ changed title to reflect parser workflow -->

  <!-- Ensures proper scaling on mobile devices -->
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <style>

    /* ------------------------------------------------------------
       Page layout styling
       ------------------------------------------------------------ */

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      max-width: 1400px; /* NEW AS OF 4/1 */ /* widened page a bit to better support side-by-side review */
      margin: 32px auto;
      padding: 0 20px;
      background: #f7f7f7;
      color: #111;
    }

    h1 {
      font-size: 2.5rem;
      margin-bottom: 24px;
    }

    /* ------------------------------------------------------------
       Card container styling
       Used for each major section of the UI
       ------------------------------------------------------------ */

    .card {
      background: white;
      border: 1px solid #ddd;
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 24px;
      box-shadow: 0 1px 2px rgba(0,0,0,0.04);
    }

    /* Horizontal row layout for form controls */
    .row {
      display: flex;
      gap: 20px;
      align-items: center;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }

    /* Grid layout for the list of school checkboxes */
    .schools-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 10px;
      margin-top: 12px;
      margin-bottom: 20px;
    }

    /* Styling for each checkbox container */
    label.checkbox {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #fafafa;
      border: 1px solid #e3e3e3;
      border-radius: 10px;
      padding: 10px 12px;
    }

    /* Primary button styling */
    button {
      background: #222;
      color: white;
      border: none;
      border-radius: 12px;
      padding: 12px 20px;
      font-size: 1rem;
      cursor: pointer;
    }

    /* Disabled button appearance */
    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    /* Subtle muted text */
    .muted {
      color: #555;
    }

    /* Grid layout for the result cards */
    .result-list {
      display: grid;
      gap: 12px;
      margin-top: 16px;
    }

    /* Individual result card */
    .result-item {
      border: 1px solid #ddd;
      border-radius: 12px;
      padding: 16px;
      background: #fcfcfc;
    }

    .result-item h4 {
      margin: 0 0 8px 0;
    }

    /* Smaller metadata text */
    .small {
      font-size: 0.95rem;
      color: #555;
      word-break: break-word;
    }

    /* Allows multi-line status messages */
    .status {
      white-space: pre-wrap;
    }

    /* Layout for action buttons */
    .action-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 12px;
      align-items: center;
    }

    /* Button-style links */
    .link-button,
    .download-link {
      display: inline-block;
      text-decoration: none;
      background: #efefef;
      color: #111;
      border: 1px solid #d4d4d4;
      border-radius: 10px;
      padding: 10px 14px;
      font-weight: 600;
    }

    /* Disabled link appearance */
    .link-button[aria-disabled="true"],
    .download-link[aria-disabled="true"] { /* NEW AS OF 4/1 */ /* made disabled styling apply to both link types */
      opacity: 0.5;
      pointer-events: none;
    }

    .output {
      margin-top: 10px;
    }

    /* Error text styling */
    .error-text {
      color: #9f1d1d;
      font-weight: 600;
    }

    /* Success text styling */
    .success-text {
      color: #166534;
      font-weight: 600;
    }

    /* Wrapper for embedded PDF preview */
    .preview-wrap {
      margin-top: 14px;
      display: none;
    }

    /* Makes preview visible when opened */
    .preview-wrap.open {
      display: block;
    }

    /* Embedded PDF viewer frame */
    .preview-frame {
      width: 100%;
      height: 700px;
      border: 1px solid #ddd;
      border-radius: 12px;
      background: white;
    }

    .review-wrap { /* NEW AS OF 4/1 */ /* new container for human-in-the-loop side-by-side review */
      margin-top: 14px;
      display: none;
    }

    .review-wrap.open { /* NEW AS OF 4/1 */
      display: block;
    }

    .review-grid { /* NEW AS OF 4/1 */ /* side-by-side panel layout */
      display: grid;
      grid-template-columns: 1.1fr 1fr;
      gap: 16px;
      align-items: start;
    }

    .review-panel { /* NEW AS OF 4/1 */
      background: white;
      border: 1px solid #ddd;
      border-radius: 12px;
      padding: 12px;
    }

    .review-panel h5 { /* NEW AS OF 4/1 */
      margin: 0 0 10px 0;
      font-size: 1rem;
    }

    .review-frame { /* NEW AS OF 4/1 */ /* PDF frame inside review panel */
      width: 100%;
      height: 700px;
      border: 1px solid #ddd;
      border-radius: 12px;
      background: white;
    }

    .table-wrap { /* NEW AS OF 4/1 */ /* scrollable spreadsheet preview area */
      max-height: 700px;
      overflow: auto;
      border: 1px solid #ddd;
      border-radius: 12px;
      background: white;
    }

    .review-table { /* NEW AS OF 4/1 */
      width: 100%;
      border-collapse: collapse;
      font-size: 0.9rem;
    }

    .review-table th,
    .review-table td { /* NEW AS OF 4/1 */
      border-bottom: 1px solid #e5e5e5;
      padding: 8px 10px;
      text-align: left;
      vertical-align: top;
    }

    .review-table th { /* NEW AS OF 4/1 */
      position: sticky;
      top: 0;
      background: #f7f7f7;
      z-index: 1;
    }

    .review-empty { /* NEW AS OF 4/1 */
      padding: 12px;
      color: #555;
    }

  </style>
</head>

<body>

  <!-- Page title -->
  <h1>NESCAC Parser Pipeline Demo</h1> <!-- /* NEW AS OF 4/1 */ changed heading to reflect parser-based workflow -->

  <!-- ------------------------------------------------------------
       Input Card
       Allows the user to configure and run the PDF discovery job
       ------------------------------------------------------------ -->
  <div class="card">

    <div class="row">

      <!-- Year selection -->
      <label>
        Year:
        <input id="year" type="number" value="2025" />
      </label>

      <!-- Optional link limit to prevent excessive scraping in demo -->
      <label>
        Limit links (demo safety):
        <input id="limit-links" type="number" value="0" min="0" />
      </label>

    </div>

    <h2>Schools</h2>
    <p class="muted">If none selected, runs all schools.</p>

    <!-- Container where the API will dynamically insert school checkboxes -->
    <div id="schools-container" class="schools-grid">
      <div class="muted">Loading schools...</div>
    </div>

    <!-- Button that triggers the PDF discovery API -->
    <button id="run-btn">Find Games</button> <!-- /* NEW AS OF 4/1 */ renamed button because PDFs are no longer the final product -->

  </div>

  <!-- ------------------------------------------------------------
       Status Card
       Displays current system status messages
       ------------------------------------------------------------ -->
  <div class="card">
    <h2>Status</h2>
    <div id="status" class="status">Idle.</div>
  </div>

  <!-- ------------------------------------------------------------
       Results Card
       Displays discovered game records, each of which can be parsed
       ------------------------------------------------------------ -->
  <div class="card">
    <h2>Discovered Games</h2> <!-- /* NEW AS OF 4/1 */ changed results heading from PDFs to games -->
    <div id="results" class="result-list">
      <div class="muted">No results yet.</div>
    </div>
  </div>

  <script>

    /* ------------------------------------------------------------
       DOM references
       These connect JavaScript to elements in the HTML page
       ------------------------------------------------------------ */

    const schoolsContainer = document.getElementById("schools-container");
    const runBtn = document.getElementById("run-btn");
    const statusEl = document.getElementById("status");
    const resultsEl = document.getElementById("results");
    const yearInput = document.getElementById("year");
    const limitLinksInput = document.getElementById("limit-links");


    /* ------------------------------------------------------------
       Status helper
       Updates the status text on the UI
       ------------------------------------------------------------ */

    function setStatus(message) {
      statusEl.textContent = message;
    }


    /* ------------------------------------------------------------
       Collect selected schools from checkboxes
       Returns array of selected school names
       ------------------------------------------------------------ */

    function getSelectedSchools() {
      const checked = document.querySelectorAll('input[name="schools"]:checked');
      return Array.from(checked).map((el) => el.value);
    }


    /* ------------------------------------------------------------
       Escape HTML to prevent injection issues when rendering text
       ------------------------------------------------------------ */

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#39;");
    }


    /* ------------------------------------------------------------
       Render school checkboxes after fetching from API
       ------------------------------------------------------------ */

    function renderSchools(schools) {

      schoolsContainer.innerHTML = "";

      if (!schools || schools.length === 0) {
        schoolsContainer.innerHTML = '<div class="muted">No schools returned by API.</div>';
        return;
      }

      for (const school of schools) {

        const label = document.createElement("label");
        label.className = "checkbox";

        const input = document.createElement("input");
        input.type = "checkbox";
        input.name = "schools";
        input.value = school;

        const span = document.createElement("span");
        span.textContent = school;

        label.appendChild(input);
        label.appendChild(span);

        schoolsContainer.appendChild(label);
      }
    }


    /* ------------------------------------------------------------
       Load list of schools from the backend API
       Endpoint: /api/schools
       ------------------------------------------------------------ */

    async function loadSchools() {
      try {

        setStatus("Loading schools...");

        /* This is where we fetch schools for use by html*/
        
        const resp = await fetch("/api/schools");
        const data = await resp.json();

        if (!resp.ok || !data.ok) {
          throw new Error(data.error || "Failed to load schools");
        }

        renderSchools(data.schools);

        if (data.year) {
          yearInput.value = data.year;
        }

        setStatus("Schools loaded.");

      } catch (err) {

        schoolsContainer.innerHTML =
          `<div class="muted">Failed to load schools: ${escapeHtml(err.message)}</div>`;

        setStatus(`Error loading schools: ${err.message}`);
      }
    }


    /* ------------------------------------------------------------
       Helper to build metadata lines in result cards
       ------------------------------------------------------------ */

    function buildDetailLine(label, value) {
      const div = document.createElement("div");
      div.className = "small";
      div.textContent = `${label}: ${value ?? ""}`;
      return div;
    }


    function normalizeRows(data) { /* NEW AS OF 4/1 */ /* normalizes possible row payload names returned by parser endpoint */
      return data.rows || data.table_rows || data.preview_rows || [];
    }


    function normalizeColumns(data, rows) { /* NEW AS OF 4/1 */ /* chooses explicit columns if provided, otherwise infers from first row */
      if (Array.isArray(data.columns) && data.columns.length > 0) {
        return data.columns;
      }
      if (rows.length > 0 && typeof rows[0] === "object" && rows[0] !== null) {
        return Object.keys(rows[0]);
      }
      return [];
    }


    function buildReviewTable(columns, rows) { /* NEW AS OF 4/1 */ /* builds HTML table for parsed spreadsheet preview */
      const tableWrap = document.createElement("div");
      tableWrap.className = "table-wrap";

      if (!rows || rows.length === 0) {
        const empty = document.createElement("div");
        empty.className = "review-empty";
        empty.textContent = "No parsed rows were returned by the parser.";
        tableWrap.appendChild(empty);
        return tableWrap;
      }

      const table = document.createElement("table");
      table.className = "review-table";

      const thead = document.createElement("thead");
      const headRow = document.createElement("tr");

      for (const column of columns) {
        const th = document.createElement("th");
        th.textContent = column;
        headRow.appendChild(th);
      }

      thead.appendChild(headRow);
      table.appendChild(thead);

      const tbody = document.createElement("tbody");

      for (const row of rows) {
        const tr = document.createElement("tr");

        for (const column of columns) {
          const td = document.createElement("td");
          td.textContent = row?.[column] ?? "";
          tr.appendChild(td);
        }

        tbody.appendChild(tr);
      }

      table.appendChild(tbody);
      tableWrap.appendChild(table);

      return tableWrap;
    }


    /* ------------------------------------------------------------
       Render discovered records returned from API

       Each card now supports parsing and side-by-side review rather
       than just preparing a PDF for display.
       ------------------------------------------------------------ */

    function renderResults(records) {

      resultsEl.innerHTML = "";

      if (!records || records.length === 0) {
        resultsEl.innerHTML = '<div class="muted">No game records found.</div>'; /* NEW AS OF 4/1 */ /* updated empty-state wording */
        return;
      }

      for (const record of records) {

        const card = document.createElement("div");
        card.className = "result-item";

        const title = document.createElement("h4");
        title.textContent = `${record.school} vs ${record.opponent}`;

        const meta = document.createElement("div");
        meta.className = "small";
        meta.textContent =
          `Date: ${record.date} | Home: ${record.home_team} | Away: ${record.away_team}`;

        const boxscore = buildDetailLine("Boxscore", record.boxscore_url);
        const pdf = buildDetailLine("PDF", record.pdf_url);

        const actionRow = document.createElement("div");
        actionRow.className = "action-row";

        const parseBtn = document.createElement("button"); /* NEW AS OF 4/1 */ /* replaced old prepare button with parser button */
        parseBtn.textContent = "Parse Game"; /* NEW AS OF 4/1 */

        const reviewBtn = document.createElement("a"); /* NEW AS OF 4/1 */ /* new review toggle control */
        reviewBtn.className = "link-button";
        reviewBtn.textContent = "Open Review";
        reviewBtn.href = "#";
        reviewBtn.setAttribute("aria-disabled", "true");

        const excelLink = document.createElement("a"); /* NEW AS OF 4/1 */ /* new final output link for parsed spreadsheet */
        excelLink.className = "download-link";
        excelLink.textContent = "Download Excel";
        excelLink.href = "#";
        excelLink.target = "_blank";
        excelLink.rel = "noopener noreferrer";
        excelLink.setAttribute("aria-disabled", "true");

        actionRow.appendChild(parseBtn); /* NEW AS OF 4/1 */
        actionRow.appendChild(reviewBtn); /* NEW AS OF 4/1 */
        actionRow.appendChild(excelLink); /* NEW AS OF 4/1 */

        const output = document.createElement("div");
        output.className = "small output";

        const reviewWrap = document.createElement("div"); /* NEW AS OF 4/1 */ /* side-by-side review container */
        reviewWrap.className = "review-wrap";

        const reviewGrid = document.createElement("div"); /* NEW AS OF 4/1 */
        reviewGrid.className = "review-grid";

        const pdfPanel = document.createElement("div"); /* NEW AS OF 4/1 */
        pdfPanel.className = "review-panel";

        const pdfPanelTitle = document.createElement("h5"); /* NEW AS OF 4/1 */
        pdfPanelTitle.textContent = "Original PDF";

        const reviewFrame = document.createElement("iframe"); /* NEW AS OF 4/1 */ /* iframe for the source PDF */
        reviewFrame.className = "review-frame";
        reviewFrame.title = `PDF review for ${record.school} vs ${record.opponent}`;

        pdfPanel.appendChild(pdfPanelTitle);
        pdfPanel.appendChild(reviewFrame);

        const tablePanel = document.createElement("div"); /* NEW AS OF 4/1 */
        tablePanel.className = "review-panel";

        const tablePanelTitle = document.createElement("h5"); /* NEW AS OF 4/1 */
        tablePanelTitle.textContent = "Parsed Spreadsheet Preview";

        const tableHost = document.createElement("div"); /* NEW AS OF 4/1 */ /* where parsed table preview gets inserted */
        tableHost.className = "review-empty";
        tableHost.textContent = "Run the parser to load preview rows.";

        tablePanel.appendChild(tablePanelTitle);
        tablePanel.appendChild(tableHost);

        reviewGrid.appendChild(pdfPanel); /* NEW AS OF 4/1 */
        reviewGrid.appendChild(tablePanel); /* NEW AS OF 4/1 */
        reviewWrap.appendChild(reviewGrid); /* NEW AS OF 4/1 */

        parseBtn.addEventListener("click", async () => { /* NEW AS OF 4/1 */ /* parser workflow replaces old /api/download-pdf workflow */

          try {

            parseBtn.disabled = true;

            output.className = "small output";
            output.textContent = "Parsing PDF and preparing review view..."; /* NEW AS OF 4/1 */

            const resp = await fetch("/api/parse-pdf", { /* NEW AS OF 4/1 */ /* changed endpoint from /api/download-pdf to parser endpoint */
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ record })
            });

            const data = await resp.json();

            if (!resp.ok || !data.ok) {
              const detail = data.detail ? ` (${data.detail})` : "";
              throw new Error((data.error || "Failed to parse PDF") + detail); /* NEW AS OF 4/1 */
            }

            const pdfPreviewUrl =
              data.pdf_preview_url ||
              data.preview_url ||
              record.pdf_url ||
              ""; /* NEW AS OF 4/1 */ /* supports a few possible backend field names */

            if (pdfPreviewUrl) {
              reviewFrame.src = pdfPreviewUrl; /* NEW AS OF 4/1 */ /* populate left-side PDF panel */
            }

            if (data.excel_download_url) { /* NEW AS OF 4/1 */ /* wire final spreadsheet download */
              excelLink.href = data.excel_download_url;
              excelLink.setAttribute("aria-disabled", "false");
            }

            reviewBtn.setAttribute("aria-disabled", "false"); /* NEW AS OF 4/1 */

            const rows = normalizeRows(data); /* NEW AS OF 4/1 */
            const columns = normalizeColumns(data, rows); /* NEW AS OF 4/1 */

            tableHost.innerHTML = ""; /* NEW AS OF 4/1 */
            tableHost.className = ""; /* NEW AS OF 4/1 */
            tableHost.appendChild(buildReviewTable(columns, rows)); /* NEW AS OF 4/1 */

            reviewWrap.classList.add("open"); /* NEW AS OF 4/1 */ /* open side-by-side review automatically after successful parse */

            output.className = "small output success-text";
            output.textContent = `Parsed successfully: ${data.filename || "Excel output ready"}`; /* NEW AS OF 4/1 */

          } catch (err) {

            output.className = "small output error-text";
            output.textContent = `Error: ${err.message}`;

          } finally {
            parseBtn.disabled = false;
          }
        });

        reviewBtn.addEventListener("click", (event) => { /* NEW AS OF 4/1 */ /* toggles review panel visibility */
          event.preventDefault();

          if (reviewBtn.getAttribute("aria-disabled") === "true") {
            return;
          }

          reviewWrap.classList.toggle("open");

          if (reviewWrap.classList.contains("open")) {
            reviewBtn.textContent = "Hide Review";
          } else {
            reviewBtn.textContent = "Open Review";
          }
        });

        excelLink.addEventListener("click", (event) => { /* NEW AS OF 4/1 */ /* prevent spreadsheet download before parse is complete */
          if (excelLink.getAttribute("aria-disabled") === "true") {
            event.preventDefault();
          }
        });

        card.appendChild(title);
        card.appendChild(meta);
        card.appendChild(boxscore);
        card.appendChild(pdf);
        card.appendChild(actionRow);
        card.appendChild(output);
        card.appendChild(reviewWrap); /* NEW AS OF 4/1 */ /* card now contains review UI instead of plain PDF preview */

        resultsEl.appendChild(card);
      }
    }


    /* ------------------------------------------------------------
       Run PDF discovery
       Calls backend API endpoint: /api/find-pdfs

       This still discovers game/PDF records first, but the parser now
       runs later per record when the user clicks Parse Game.
       ------------------------------------------------------------ */

    async function runDiscovery() {

      try {

        runBtn.disabled = true;

        resultsEl.innerHTML = "";

        setStatus("Finding games and PDF records..."); /* NEW AS OF 4/1 */ /* status text updated for new workflow */

        const selectedSchools = getSelectedSchools();

        const payload = {
          year: Number(yearInput.value),
          schools: selectedSchools.length > 0 ? selectedSchools : null,
          limit_links: Number(limitLinksInput.value || 0)
        };

        const resp = await fetch("/api/find-pdfs", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });

        const data = await resp.json();

        if (!resp.ok || !data.ok) {
          const detail = data.detail ? ` (${data.detail})` : "";
          throw new Error((data.error || "Failed to find PDFs") + detail);
        }

        renderResults(data.results);

        setStatus(`Found ${data.count} game record(s). Click "Parse Game" to generate Excel output.`); /* NEW AS OF 4/1 */ /* user guidance now reflects parser step */

      } catch (err) {

        resultsEl.innerHTML = '<div class="muted">No results.</div>';
        setStatus(`Error finding PDFs: ${err.message}`);

      } finally {
        runBtn.disabled = false;
      }
    }


    /* Run discovery when button clicked */
    runBtn.addEventListener("click", runDiscovery);

    /* Load schools automatically when page opens */
    loadSchools();

  </script>

</body>
</html>
